rationale: 'Delta_n_vpi=0.002 is an explicitly chosen design target (push-pull, n_upper/n_lower
  = core_index +/- Delta_n/2), not a value found by sweep-and-select. The arm length
  is derived from this target via an idealized formula corrected by phase_factor_prior
  (an earlier embedded-device calibration at a 10x larger push-pull differential),
  then checked by FDTD (si/notebooks/08_mzm.ipynb Section 10): the phase swing at Delta_n_vpi
  is 1.042 pi against a 1.000 pi target, read from the normalized output split with
  the branch set by the sign of S31/S41. phase_factor_prior is an effective phase-response
  factor, not a 0<=Gamma<=1 mode-confinement factor -- see mzm.py''s own DEFAULT_PARAMS
  comment for why it is allowed to exceed 1. Edit this rationale directly if a different
  Delta_n_vpi or phase_factor_prior is preferred.'
