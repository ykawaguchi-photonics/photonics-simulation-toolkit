limitations:
- only |c|^2 saved, not the complex coupling coefficient c(lambda); a SAX model would
  need its phase
- absolute fractions carry ~10% grid uncertainty at 36.7 nm cells
- metal mirror is a sigma=4e7 S/m stand-in, not a dispersive Au/Al model
- fiber modeled as a Gaussian waist on a plane in the oxide; Fresnel loss applied
  as a factor
- minimized aperture (6 lines, ~5 um) sized for a 2.5 um lensed spot, not SMF-28
rationale: Fan half-angle 17.5 deg and r0 = 4.3 um make the beam width at the emission
  point match the 2.5 um lensed spot; ellipse focus 1.2 um behind the apex = phase
  center of the fan wave; BOX 1.25 um on a metal mirror = in-phase bottom reflection.
  Fiber position and tilt optimized at 1.35 um, then held fixed for the spectrum.
