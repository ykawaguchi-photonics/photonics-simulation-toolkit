rationale: 'Adjoint-optimized over 80 NLopt MMA iterations, maximizing the average
  of three objective renderings of the same raw design variables every iteration --
  nominal (eta_i=0.5), eroded (eta_e=0.54566, -5nm), and dilated (eta_d=0.45462, +5nm)
  -- via meep.adjoint''s conic_filter + tanh_projection (Sigmund/Lazarov/Wang robust-topology-optimization
  technique), warm-started from the same rasterized Euler-bend curve bend_topopt.py
  uses. design_grid_n=181 (vs. bend_topopt.py''s 31) was a MEASURED necessity, not
  a stylistic choice -- see docs/simulation_settings_record.md for why the coarser
  grid leaves the eta-threshold mechanism completely dead at the schedule''s later
  beta stages. Headline result: notebook 04''s own design showed a max|delta T|=0.0270
  transmission swing under +/-5nm; this design shows 0.0026 (+90.4% change). Validated
  by an independent two-port FDTD measurement of the nominal sub-design (not the optimizer''s
  own objective). Edit this rationale directly, or re-run Section 5 with a different
  target_bias_um or iteration budget, if a stronger design is found.'
