rationale: Adjoint-optimized over 80 NLopt MMA iterations, warm-started from a rasterized
  R=1.0um Euler (clothoid) bend (build_euler_initial_density()) rather than a uniform
  gray density -- a blank start did not converge to a design that passed checks.run_all_checks
  under this module's corrected TE constraint (see the module docstring's TE/TM correction),
  while refining from this warm start did. Final design binarized at a 0.5 density
  threshold and validated by an independent two-port FDTD measurement (not the optimizer's
  own objective). Edit this rationale directly, or re-run Section 5 with more iterations
  / a different filter radius, if a stronger design is found.
