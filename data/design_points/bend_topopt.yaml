rationale: Adjoint-optimized over 80 NLopt MMA iterations on a compact 2.5x2.5um design
  region, from a corner-biased random initial density (seed=0) -- NOT a uniform-gray
  start (measured to fail here, see docs/troubleshooting_log.md) and NOT an Euler-curve
  warm start (which was used in an earlier revision of this notebook but found to
  understate what topology optimization can do, by refining an already-smooth curve
  rather than discovering structure). This footprint was chosen from a measured region-size
  sweep (Section 3) as the smallest that clears both a >=75% absolute transmission
  target and a real margin over a conventional Euler bend at the same footprint. Final
  design binarized at a 0.5 density threshold and validated by an independent two-port
  FDTD measurement (not the optimizer's own objective), at resolution=40 (one step
  finer than the resolution=30 training loop). 04b_bend_topopt_robust.ipynb builds
  directly on this design's own saved x_opt to measure its fabrication-bias sensitivity
  and build a robustness-averaged alternative.
