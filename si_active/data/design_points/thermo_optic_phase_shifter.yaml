model_assumptions:
- 2D cross-section, uniform along the heater (heater length >> cross-section)
- substrate 6 um deep in the model with an isothermal bottom; 6 -> 150 um changes
  P_pi by ~-4 % and tau by ~+10 %
- 'time constants 1.3-2x slower than measured in the benchmark: use them as relative
  values'
- crosstalk beyond ~15 um is set by 3D substrate spreading and is not predicted
- 'N++ loss: Drude lambda^2 scaling of Jacques'' 1.55 um absorption (estimate)'
- optics non-dispersive at wl0 except n_g_dispersive
